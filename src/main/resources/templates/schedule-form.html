<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title th:text="${editMode ? '予定を編集 | カレンダー' : '予定を追加 | カレンダー'}">予定 | カレンダー</title><link rel="stylesheet" th:href="@{/css/style.css}"><script th:src="@{/js/theme.js}"></script></head>
<body class="form-page"><main class="form-layout"><section class="form-intro"><button class="theme-toggle" type="button" aria-label="ダークモードに切り替える" aria-pressed="false"><span aria-hidden="true">☾</span></button><a class="brand" th:href="@{/}"><span class="brand-mark">☆</span>カレンダー</a><div><p>YOUR SCHEDULE</p><h1 th:text="${editMode ? '予定を編集' : '予定を追加'}">予定を追加</h1><p>日時と内容を入力して、あなたのカレンダーに予定を残しましょう。</p></div></section>
<section class="form-panel"><form th:object="${scheduleForm}" th:action="${editMode ? '/schedules/' + scheduleId : '/schedules'}" method="post">
    <div class="field"><label for="title">予定名 <em>必須</em></label><input id="title" th:field="*{title}" maxlength="80" placeholder="例：プロジェクトの打ち合わせ" autofocus><p class="field-error" th:errors="*{title}"></p></div>
    <div class="date-fields"><div class="field"><label for="eventDate">開始日 <em>必須</em></label><input id="eventDate" type="date" th:field="*{eventDate}"><p class="field-error" th:errors="*{eventDate}"></p></div><div class="field"><label for="endDate">終了日 <em>必須</em></label><input id="endDate" type="date" th:field="*{endDate}"><p class="field-error" th:errors="*{endDate}"></p></div></div>
    <div class="time-fields"><div class="field"><label for="startTime">開始時刻</label><input id="startTime" type="time" th:field="*{startTime}"></div><div class="field"><label for="endTime">終了時刻</label><input id="endTime" type="time" th:field="*{endTime}"><p class="field-error" th:errors="*{endTime}"></p></div></div>
    <fieldset class="field color-field"><legend>カラー</legend><label><input type="radio" th:field="*{color}" value="sage"><span class="sage"></span>セージ</label><label><input type="radio" th:field="*{color}" value="coral"><span class="coral"></span>コーラル</label><label><input type="radio" th:field="*{color}" value="ochre"><span class="ochre"></span>オーカー</label></fieldset>
    <div class="field"><label for="memo">メモ</label><textarea id="memo" th:field="*{memo}" maxlength="500" rows="5" placeholder="補足があれば入力してください（任意）"></textarea><p class="field-error" th:errors="*{memo}"></p></div>
    <div class="form-actions"><a th:href="@{/}">キャンセル</a><button type="submit" th:text="${editMode ? '更新する' : '登録する'}">登録する</button></div>
</form><form class="delete-form" th:if="${editMode}" th:action="@{/schedules/{id}/delete(id=${scheduleId})}" method="post" onsubmit="return confirm('この予定を削除しますか？');"><button type="submit">この予定を削除</button></form></section></main></body></html>
